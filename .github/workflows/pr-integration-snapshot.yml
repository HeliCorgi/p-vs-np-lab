name: PR integration preparation

on:
  push:
    branches: [maintenance/pr-integration-review-20261112]
    paths:
      - '.github/workflows/pr-integration-snapshot.yml'
      - '.github/prepare_pr_integration.py'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare and verify pinned integration trees without updating any branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python .github/prepare_pr_integration.py
      - name: Publish verified Git objects only; no reference updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/prepare_pr_integration.py --publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verified-pr-integration
          path: integration-review/
          retention-days: 3
          if-no-files-found: error
